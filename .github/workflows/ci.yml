name: CI

on:
  push:
    branches: [main, fix/review-and-lag]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  android-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:processReleaseMainManifest
        working-directory: android
      - name: Guard merged release manifest
        working-directory: android
        run: |
          manifest="$(find ../build/app/intermediates/merged_manifest/release -type f -name AndroidManifest.xml -print -quit)"
          if [ -z "$manifest" ]; then
            echo "Merged release manifest was not produced" >&2
            exit 1
          fi
          if grep -Eq 'android.permission\.(INTERNET|QUERY_ALL_PACKAGES)' "$manifest"; then
            echo "Forbidden permission found in merged release manifest: $manifest" >&2
            exit 1
          fi

  android-instrumented:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: cd android && ./gradlew :app:connectedDebugAndroidTest
